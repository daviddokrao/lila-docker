[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes = 0

[program:caddy]
command=caddy run --config /mono.Caddyfile
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:mongo]
command=mongod --logpath /var/log/mongodb/mongod.log --dbpath /seeded
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:redis]
command=redis-server
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:lila-ws]
# sbt 1 stages to target/universal/stage; sbt 2 (which lila-ws is on) stages to
# target/out/jvm/<scala>/<project>/universal/stage. Accept either, so this keeps
# working whichever side migrates next.
command=bash -c 'exec $(ls -d /lila-ws/target/universal/stage/bin/lila-ws /lila-ws/target/out/jvm/*/lila-ws/universal/stage/bin/lila-ws 2>/dev/null | head -1) -Dcsrf.origin=%(ENV_LILA_URL)s'
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

# Move provider for playing the computer and for analysis. lila talks to lila-fishnet
# over the local redis, and the fishnet worker pulls jobs from it over HTTP.
#
# HTTP_HOST=127.0.0.1: lila-fishnet mặc định nghe 0.0.0.0:9665 (AppConfig.scala) và
# /fishnet/acquire nhận MỌI bearer token (chỉ chặn token rỗng). Trên mạng `edge` dùng
# chung ~170 container của mọi dự án, điều đó nghĩa là một container hàng xóm bất kỳ
# gọi được acquire, lấy ván của người thật đang chơi với máy rồi ÉP nước đi (chữ ký
# chống nước-giả tính từ chính chuỗi moves acquire vừa trả — không phải bí mật). Đây
# là P1 audit 22/08 (N1-H). Cổng HTTP này CHỈ có worker fishnet nội bộ dùng, và nó
# vốn đã gọi qua http://127.0.0.1:9665 (xem [program:fishnet] dưới); lila↔lila-fishnet
# đi qua REDIS chứ không phải HTTP. Nên ép nghe loopback đóng hẳn lỗ mà không hỏng gì.
[program:lila-fishnet]
# Same dual staging layout as lila-ws: sbt 2 stages under target/out/jvm.
command=bash -c 'export HTTP_HOST=127.0.0.1; exec $(ls -d /lila-fishnet/app/target/universal/stage/bin/lila-fishnet /lila-fishnet/app/target/out/jvm/*/lila-fishnet/universal/stage/bin/lila-fishnet 2>/dev/null | head -1)'
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:fishnet]
# One core only: this box runs many unrelated services and a chess engine will happily
# eat every thread it is given. Enough for low level bots and short analysis.
# lila-fishnet accepts any non-empty token, but an empty one sends a bare
# `Authorization: Bearer` header that fails to parse as a 400.
command=bash -c 'sleep 20 && exec /usr/local/bin/fishnet --endpoint http://127.0.0.1:9665/fishnet --key lilafishnetdev --cores 1 --max-backoff 5 --no-conf --no-stats-file'
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:lila]
# seed-once tự chờ mongod sẵn sàng rồi mới quyết định có seed hay không, nên
# không cần sleep đoán chừng ở đây nữa.
command=bash -c '/scripts/seed-once.sh && /lila/target/universal/stage/bin/lila -Dconfig.file="/lila/conf/mono.conf" -Dlogger.file="/lila/conf/logger.dev.xml"'
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
