[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes = 0

[program:caddy]
command=caddy run --config /mono.Caddyfile
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:mongo]
command=mongod --logpath /var/log/mongodb/mongod.log --dbpath /seeded
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:redis]
command=redis-server
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:lila-ws]
# sbt 1 stages to target/universal/stage; sbt 2 (which lila-ws is on) stages to
# target/out/jvm/<scala>/<project>/universal/stage. Accept either, so this keeps
# working whichever side migrates next.
command=bash -c 'exec $(ls -d /lila-ws/target/universal/stage/bin/lila-ws /lila-ws/target/out/jvm/*/lila-ws/universal/stage/bin/lila-ws 2>/dev/null | head -1) -Dcsrf.origin=%(ENV_LILA_URL)s'
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

# Move provider for playing the computer and for analysis. lila talks to lila-fishnet
# over the local redis, and the fishnet worker pulls jobs from it over HTTP.
[program:lila-fishnet]
# Same dual staging layout as lila-ws: sbt 2 stages under target/out/jvm.
command=bash -c 'exec $(ls -d /lila-fishnet/app/target/universal/stage/bin/lila-fishnet /lila-fishnet/app/target/out/jvm/*/lila-fishnet/universal/stage/bin/lila-fishnet 2>/dev/null | head -1)'
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:fishnet]
# One core only: this box runs many unrelated services and a chess engine will happily
# eat every thread it is given. Enough for low level bots and short analysis.
# lila-fishnet accepts any non-empty token, but an empty one sends a bare
# `Authorization: Bearer` header that fails to parse as a 400.
command=bash -c 'sleep 20 && exec /usr/local/bin/fishnet --endpoint http://127.0.0.1:9665/fishnet --key lilafishnetdev --cores 1 --max-backoff 5 --no-conf --no-stats-file'
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:lila]
# sleep 5 seconds to give mongodb time to start
command=bash -c 'sleep 5 && /scripts/reset-db.sh && /lila/target/universal/stage/bin/lila -Dconfig.file="/lila/conf/mono.conf" -Dlogger.file="/lila/conf/logger.dev.xml"'
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
