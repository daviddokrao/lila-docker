# Gửi mail thật (đặt lại mật khẩu, xác nhận tài khoản).
#
# Tất cả đều là `${?...}`: không đặt biến nào thì mọi giá trị giữ nguyên như
# base.conf, tức mock = true và KHÔNG có thư nào rời máy. Muốn gửi thật phải
# nói rõ bằng MAILER_MOCK=false — mặc định im lặng an toàn hơn là vô tình
# gửi thư đi từ một bản demo.
#
# Để ở đây thay vì ghi cứng để đổi nhà cung cấp hay đổi người gửi chỉ cần sửa
# biến môi trường rồi khởi động lại, không phải dựng lại image.
mailer.primary.mock = ${?MAILER_MOCK}
mailer.primary.host = ${?MAILER_HOST}
mailer.primary.port = ${?MAILER_PORT}
mailer.primary.tls = ${?MAILER_TLS}
mailer.primary.user = ${?MAILER_USER}
mailer.primary.password = ${?MAILER_PASSWORD}
mailer.primary.sender = ${?MAILER_SENDER}
