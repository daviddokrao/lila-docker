include "base"
include "version"

# Khoá AES bọc ngoài hash bcrypt của MỌI mật khẩu (modules/security/PasswordHasher.scala).
# KHÔNG ghi giá trị vào đây: giá trị cũ "9qEYN0ThHer1KWLNekA76Q==" là MẶC ĐỊNH CÔNG KHAI
# của upstream (lila/conf/application.conf.default) — ai đọc GitHub cũng có, nên một bản
# dump MongoDB rò ra là bóc được lớp AES, chỉ còn trơ bcrypt.
# Không có `?`: thiếu biến thì lila CHẾT NGAY lúc khởi động, thay vì âm thầm chạy bằng
# một khoá mà cả thế giới biết. Giá trị nằm ở deploy/.env (đã gitignore).
# Xoay khoá KHÔNG làm hỏng mật khẩu ai — xem HANDOFF mục "Xoay bpass.secret".
user.password.bpass.secret = ${LILA_BPASS_SECRET}

# BỐN khoá KÝ dưới đây base.conf để mặc định "???" — giá trị CÔNG KHAI của upstream
# trên GitHub. login_token đặc biệt nguy: token đăng-nhập-bằng-liên-kết chỉ ký bằng
# khoá này + userId (công khai) + mốc thời gian, KHÔNG có bí mật riêng người dùng —
# ai đọc "???" tự đúc được token đăng nhập cho MỌI tài khoản, kể cả admin (P0 audit
# 22/08). email_change/password_reset/email_confirm cùng một hạng. KHÔNG có `?`: thiếu
# biến thì lila CHẾT NGAY lúc khởi động, thay vì âm thầm chạy bằng khoá cả thế giới
# biết. Giá trị nằm ở deploy/.env (đã gitignore) — mỗi khoá là chuỗi ngẫu nhiên ≥32
# byte, độc lập nhau. Xoay khoá chỉ vô hiệu các liên kết đang chờ (magic-link / đặt
# lại mật khẩu / đổi email chưa bấm), KHÔNG làm hỏng mật khẩu hay tài khoản ai.
security.login_token.secret = ${LILA_LOGIN_TOKEN_SECRET}
security.password_reset.secret = ${LILA_PASSWORD_RESET_SECRET}
security.email_change.secret = ${LILA_EMAIL_CHANGE_SECRET}
security.email_confirm.secret = ${LILA_EMAIL_CONFIRM_SECRET}

net.site.name = ${?LILA_SITE_NAME}
# base.conf để net.email = "" nên MỌI nút "Bấm để hiện địa chỉ email" trên trang
# Liên hệ mở ra một địa chỉ rỗng. Đặt bằng biến để đổi hòm thư không cần dựng
# lại image; mặc định vẫn là hòm thư của HungKings.
net.email = ${?LILA_CONTACT_EMAIL}
net.domain = ${?LILA_DOMAIN}
net.socket.domains = [ ${?LILA_DOMAIN} ]
net.asset.base_url = ${?LILA_URL}
net.base_url = ${?LILA_URL}
# Hạn mức gọi của lila (đăng ký / đăng nhập / magic-link / đổi mật khẩu — 23 chỗ).
# base.conf mặc định BẬT (true); bản này TỪNG chốt cứng `false`, nghĩa là prod LỎNG
# hơn cả máy dev — mọi trần chống lạm dụng thành no-op (P0-5 audit 22/08). Nay đưa về
# biến, mặc định BẬT: rỗng/không đặt ⇒ thừa kế base.conf = true. Chỉ tắt khi thật sự
# cần (đo tải), bằng LILA_RATELIMIT=false trong deploy/.env.
# ⚠️ Bẫy HOCON như LILA_FORUM: biến RỖNG vẫn tính là "đã đặt" và parse bool sẽ NỔ —
# hoặc để true/false, hoặc bỏ hẳn dòng khai trong .env (compose đã có `:-true`).
net.ratelimit = ${?LILA_RATELIMIT}
# SEO — cho Google index (David chốt 05/08, hungkings.com nay là production thật).
# base.conf để crawlable=false → robots.txt "Disallow: /" (Main.scala) + <meta noindex>
# (page.scala). Bật true gỡ cả hai. LƯU Ý: robots.txt vốn còn đòi Prod-mode, nhưng image
# mono chạy Dev-mode CỐ Ý → đã sửa Main.scala bỏ ràng buộc isProd (chỉ còn crawlable +
# domain khớp). Cảnh báo HOCON giống LILA_FORUM: biến RỖNG vẫn tính "đã đặt" và parse bool
# sẽ nổ — để true/false hoặc bỏ hẳn dòng khai trong deploy/.env.
net.crawlable = ${?LILA_CRAWLABLE}
# Trang chủ v2 (HOME-REDESIGN-PLAN.md). Bật: LILA_HOME_V2=true trong deploy/.env → redeploy.
net.home.v2 = ${?LILA_HOME_V2}
net.home.sidebar = ${?LILA_HOME_SIDEBAR}
# Diễn đàn tạm tắt (David chốt 04/08): LILA_FORUM=false ẩn mọi lối vào + chặn /forum.
# Bật lại = đổi thành true trong deploy/.env rồi deploy, KHÔNG cần dựng lại image.
# LƯU Ý HOCON: biến RỖNG vẫn tính là "đã đặt" — để trống LILA_FORUM là ép về chuỗi rỗng
# và parse bool sẽ nổ. Hoặc đặt true/false, hoặc bỏ hẳn dòng khai trong .env.
net.forum.enabled = ${?LILA_FORUM}
# Broadcast/tiếp sóng tạm tắt (David chốt 06/08): LILA_BROADCAST=false ẩn mọi lối vào +
# chặn /broadcast. Lý do: relay ván elite THẬT buộc kéo PGN từ nguồn ngoài (Lichess
# Broadcast API là ứng viên tốt nhất) = thêm phụ thuộc sống vào Lichess, ngược việc đang
# làm; David chọn ẩn hẳn tới khi có nguồn không-Lichess. Bật lại = true trong deploy/.env
# rồi deploy, KHÔNG cần dựng lại image. Cảnh báo HOCON giống LILA_FORUM: biến RỖNG vẫn
# tính là "đã đặt" và parse bool sẽ nổ — hoặc true/false, hoặc bỏ hẳn dòng khai trong .env.
net.broadcast.enabled = ${?LILA_BROADCAST}
# Trang "Người bảo trợ" (/patron) + bảng so sánh gói (/features) tạm tắt: LILA_PATRON=false.
# Lý do: mọi nút Donate đã gỡ khỏi site từ Mốc D, nhưng /patron vẫn sống và vẫn mời người
# dùng "trở thành Người bảo trợ" + liệt kê tiền tệ như thể mua được — một ngõ cụt không có
# cổng thanh toán nào phía sau. /features tắt theo vì nó là bảng SO SÁNH "miễn phí vs Người
# bảo trợ", tức khoe một gói trả phí không tồn tại. Bật lại = true trong deploy/.env rồi
# deploy, KHÔNG cần dựng lại image. Cảnh báo HOCON giống LILA_FORUM: biến RỖNG vẫn tính là
# "đã đặt" và parse bool sẽ nổ — hoặc true/false, hoặc bỏ hẳn dòng khai trong .env.
net.patron.enabled = ${?LILA_PATRON}
# Thư viện video (/video) tạm tắt: LILA_VIDEO=false. Lý do: đây là bộ video do LICHESS
# tuyển chọn, tiêu đề toàn tiếng Anh, trang kéo ảnh thu nhỏ từ img.youtube.com (phụ thuộc
# ngoài), và không có lối vào nào từ thanh điều hướng. Bật lại = true trong deploy/.env
# rồi deploy, KHÔNG cần dựng lại image. Cảnh báo HOCON giống LILA_FORUM: biến RỖNG vẫn
# tính là "đã đặt" và parse bool sẽ nổ — hoặc true/false, hoặc bỏ hẳn dòng khai trong .env.
net.video.enabled = ${?LILA_VIDEO}
# Hệ điểm tích luỹ + đổi quà + giới thiệu 33%: LILA_POINTS=true để BẬT (mặc định của
# base.conf là TẮT — ngược với các cờ trên, vì cờ này gác một tính năng MỚI cần service
# ngoài `hungkings-points`, chứ không gác tính năng có sẵn của upstream). Tắt = /diem,
# /cua-hang, /diem-app/*, /r/<mã> đều 404 và huy hiệu điểm trên header không hiện.
# Cảnh báo HOCON giống LILA_FORUM: biến RỖNG vẫn tính là "đã đặt" và parse bool sẽ nổ —
# hoặc true/false, hoặc bỏ hẳn dòng khai trong .env.
net.points.enabled = ${?LILA_POINTS}
# Danh bạ HLV người thật (/coach) tạm tắt: sau khi gỡ 12 hồ sơ giả, danh bạ còn 0 người —
# hiện trang rỗng vô nghĩa, không lối vào nào từ thanh điều hướng trỏ tới. Mặc định
# base.conf là TẮT (giống points.enabled: gác một trạng thái RỖNG thật của bản này, không
# phải tính năng có sẵn cần giữ tương thích ngược). Bật lại khi có HLV thật đăng ký:
# LILA_COACH_DIRECTORY=true trong deploy/.env rồi deploy, KHÔNG cần dựng lại image.
# ĐỪNG dùng LILA_COACH_INTERNAL_URL — đó là đích proxy của HLV AI /hlv, tính năng khác hẳn.
# Cảnh báo HOCON giống LILA_FORUM: biến RỖNG vẫn tính là "đã đặt" và parse bool sẽ nổ —
# hoặc true/false, hoặc bỏ hẳn dòng khai trong .env.
net.coach.enabled = ${?LILA_COACH_DIRECTORY}
# `LILA_POINTS_INTERNAL_URL` và `LILA_POINTS_HMAC_SECRET` KHÔNG khai ở đây: Main.scala
# đọc thẳng `sys.env`, đúng như `LILA_COACH_INTERNAL_URL` vẫn làm. Khai thêm vào HOCON
# sẽ tạo ra hai nguồn sự thật cho cùng một giá trị, mà chỉ một nguồn được đọc.
# Khoá PHẢI trùng `POINTS_HMAC_SECRET` của service; lệch nhau thì mọi request 401 và
# triệu chứng trông y hệt "hệ điểm chết".
# Khám phá khai cuộc + tablebase: image demo là MỘT container gộp, bên trong chỉ có
# caddy/mongod/redis/java/fishnet — không có gì lắng nghe ở 9002/9000 (đã netstat).
# Để nguyên thì lila gửi "http://localhost:9002" xuống trình duyệt NGƯỜI DÙNG, tức máy
# họ tự gọi localhost của CHÍNH HỌ. David chốt 04/08: ẨN HẲN trên demo.
# Bật lại (khi đã có service thật): LILA_EXPLORER=true + trỏ 2 endpoint bên dưới → deploy.
# KHÔNG cần dựng lại image. Cảnh báo HOCON giống LILA_FORUM: biến RỖNG vẫn tính là
# "đã đặt" và parse bool sẽ nổ — hoặc true/false, hoặc bỏ hẳn dòng khai trong .env.
explorer.enabled = ${?LILA_EXPLORER}
explorer.endpoint = ${?LILA_EXPLORER_ENDPOINT}
explorer.tablebase_endpoint = ${?LILA_TABLEBASE_ENDPOINT}
# Điểm cuối dev (127.0.0.1:3000 = server asset của `ui/build --dev`, localhost:8666)
# không có lý do gì nằm trong CSP của bản production.
net.local_dev = ${?LILA_LOCAL_DEV}
# Giải swiss "chính thức" tự sinh (Swiss.generate mỗi 3h): gán cứng teamId="lichess-swiss"
# + createdBy="lichess", cả hai KHÔNG tồn tại trên fork → mọi trang /swiss/<id> trả 404 và
# trang /swiss lộ chữ "lichess-swiss" làm tên đội. David chốt 05/08: TẮT trên demo.
# Bật lại = true trong deploy/.env rồi deploy, KHÔNG cần dựng lại image. Cảnh báo HOCON
# giống LILA_FORUM: biến RỖNG vẫn tính là "đã đặt" và parse bool sẽ nổ — true/false hoặc bỏ hẳn.
swiss.official_schedule = ${?LILA_SWISS_OFFICIAL}
# Engine ngoài: base.conf mặc định trỏ "http://localhost:9666" (nơi lila-engine chạy trên
# máy DEV). Bản demo KHÔNG có broker engine (upstream prod trỏ engine.lichess.ovh, ta không
# có) nên endpoint đó chỉ là rác lọt vào CSP connect-src của mọi trang phân tích. Để RỖNG:
# cspExternalEngine bỏ hẳn khỏi CSP + client không nhận endpoint. Muốn bật (khi đã có broker):
# đặt LILA_EXTERNAL_ENGINE_ENDPOINT trong deploy/.env rồi deploy, KHÔNG cần dựng lại image.
externalEngine.endpoint = ""
externalEngine.endpoint = ${?LILA_EXTERNAL_ENGINE_ENDPOINT}

# Web Push (P1.9b). base.conf ghi cứng **khoá VAPID CÔNG KHAI CỦA LICHESS** — mọi
# subscription trình duyệt tạo ra trên HungKings đều bị khoá vào khoá của Lichess, tức
# vô dụng với ta kể cả sau này có dịch vụ đẩy riêng. Để rỗng là trạng thái TRUNG THỰC:
# `page.scala` bỏ luôn thuộc tính `data-vapid`, client thấy thiếu thì không đăng ký nữa.
#
# QUAN TRỌNG — vì sao chưa bật được: lila **không tự gửi push**. `WebPush.scala:66` chỉ
# POST sang `push.web.url`, một SERVICE RIÊNG (`lila-push`, viết bằng Rust) giữ khoá
# RIÊNG và làm phần mã hoá/ký. Không dựng service đó thì dù có khoá vẫn không thư nào
# rời máy — `config.url.nonEmpty.so` nuốt im lặng. Xem PROGRESS mục G8.
push.web.vapid_public_key = ""
push.web.vapid_public_key = ${?LILA_VAPID_PUBLIC_KEY}
push.web.url = ${?LILA_PUSH_URL}

# Dọn các điểm cuối hạ tầng của Lichess còn sót trong base.conf. Override ở ĐÂY chứ
# không sửa base.conf để giữ base.conf merge sạch với upstream. Không cái nào hoạt động
# trên demo (ta không có server monitor/gif/creds của Lichess), nhưng để nguyên thì hoặc
# lộ tên "lichess" hoặc âm thầm gọi tới máy chủ của Lichess.
net.prodDomain = ${?LILA_DOMAIN}                      # base.conf để "lichess.org" (field này lila chỉ đọc, không dùng)
api.influx_event.endpoint = "http://localhost:8086/write?db=events"  # base: monitor.lichess.ovh
game.gifUrl = "http://localhost:6175"                 # base: gif.lichess.ovh — export GIF vốn đã hỏng (demo không có service gif)
streamer.keyword = "HungKings"                        # base: "lichess.org" — từ khoá streamer để trong tiêu đề stream

push.firebase.mobile.url = "https://fcm.googleapis.com/v1/projects/lichess-testing-df65f/messages:send"
push.firebase.mobile.json = "/opt/firebase-service-account.json"

# Gửi mail thật (đặt lại mật khẩu, xác nhận tài khoản).
#
# Tất cả đều là `${?...}`: không đặt biến nào thì mọi giá trị giữ nguyên như
# base.conf, tức mock = true và KHÔNG có thư nào rời máy. Muốn gửi thật phải
# nói rõ bằng MAILER_MOCK=false — mặc định im lặng an toàn hơn là vô tình
# gửi thư đi từ một bản demo.
#
# Để ở đây thay vì ghi cứng để đổi nhà cung cấp hay đổi người gửi chỉ cần sửa
# biến môi trường rồi khởi động lại, không phải dựng lại image.
mailer.primary.mock = ${?MAILER_MOCK}
mailer.primary.host = ${?MAILER_HOST}
mailer.primary.port = ${?MAILER_PORT}
mailer.primary.tls = ${?MAILER_TLS}
mailer.primary.user = ${?MAILER_USER}
mailer.primary.password = ${?MAILER_PASSWORD}
mailer.primary.sender = ${?MAILER_SENDER}
