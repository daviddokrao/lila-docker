name: Publish Image

on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'Lila repository to build'
        required: false
        # PHẢI là fork, không phải lichess-org. Ảnh dựng ra mang tag `lila-<branch>`,
        # tức `lila-master` — ĐÚNG cái tag bản demo đang chạy. Để mặc định upstream thì
        # chỉ cần một lần bấm "Run workflow" mà không sửa ô này (hoặc một lần cron/push
        # kích hoạt) là tag production bị ghi đè bằng bản Lichess trắng: mất sạch thương
        # hiệu HungKings, mất nội dung CMS. Hỏng IM LẶNG — build vẫn xanh, chỉ vỡ ở lần
        # `docker pull` + deploy kế tiếp.
        default: 'daviddokrao/lila'
        type: string
      branch:
        description: 'Branch to build'
        required: false
        default: 'master'
        type: string
      platforms:
        description: 'Target platforms for the build'
        required: false
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'linux/amd64'
          - 'linux/arm64'
  schedule:
    - cron: '0 17 * * *'
  push:
    paths:
      - '.github/workflows/publish-image.yml'
      - 'conf/mono.Caddyfile'
      - 'conf/mono.conf'
      - 'docker/mono.Dockerfile'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      is_lila_main: ${{ steps.build_vars.outputs.is_lila_main }}
    steps:
      - name: Setup build variables
        id: build_vars
        run: |
          # Fallback cũng phải là fork: cron và push KHÔNG có inputs nên luôn rơi vào đây.
          echo "repo=${{ github.event.inputs.repo || 'daviddokrao/lila' }}" >> $GITHUB_OUTPUT
          echo "branch=${{ github.event.inputs.branch || 'master' }}" >> $GITHUB_OUTPUT
          if [ "${{ github.event.inputs.platforms || 'all' }}" = "all" ]; then
            echo "platforms=linux/amd64,linux/arm64" >> $GITHUB_OUTPUT
          else
            echo "platforms=${{ github.event.inputs.platforms }}" >> $GITHUB_OUTPUT
          fi
          echo "is_lila_main=$([ "${{ github.event.inputs.repo || 'daviddokrao/lila' }}" = "lichess-org/lila" ] && [ "${{ github.event.inputs.branch || 'master' }}" = "master" ] && echo "true" || echo "false")" >> $GITHUB_OUTPUT

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Checkout lila
        uses: actions/checkout@v5
        with:
          repository: ${{ steps.build_vars.outputs.repo }}
          ref: ${{ steps.build_vars.outputs.branch }}
          path: 'repos/lila'

      - name: Checkout lila-ws
        uses: actions/checkout@v5
        with:
          repository: 'lichess-org/lila-ws'
          path: 'repos/lila-ws'

      # Fork CHỨ KHÔNG phải lichess-org: nội dung thật của các trang CMS (Giới thiệu,
      # Điều khoản, Quyền riêng tư, biến thể cờ...) nằm ở data/cms trong fork này.
      # Lấy bản upstream thì image vẫn dựng thành công, nhưng các trang đó hiện lại
      # văn bản mẫu — hỏng im lặng, không có dấu hiệu nào lúc build.
      - name: Checkout lila-db-seed
        uses: actions/checkout@v5
        with:
          repository: 'daviddokrao/lila-db-seed'
          path: 'repos/lila-db-seed'

      # Without this the image has no move provider, so playing the computer hangs on
      # "waiting for opponent" forever and analysis never returns.
      - name: Checkout lila-fishnet
        uses: actions/checkout@v5
        with:
          repository: 'lichess-org/lila-fishnet'
          path: 'repos/lila-fishnet'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          image: tonistiigi/binfmt:qemu-v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,prefix=lila-,value=${{ steps.build_vars.outputs.branch }}
            type=raw,value=main,enable=${{ steps.build_vars.outputs.is_lila_main }}
            type=raw,value=latest,enable=${{ steps.build_vars.outputs.is_lila_main }}
      
      - name: Free disk space on Ubuntu runner
        uses: kfir4444/free-disk-space@main
        with:
          tool-cache: true

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ steps.build_vars.outputs.platforms }}
          file: docker/mono.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
