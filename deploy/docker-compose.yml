services:
  # Single self-contained image built by .github/workflows/publish-image.yml from
  # our lila fork: lila + lila-ws + mongodb + redis + caddy under supervisord.
  # Nothing is built on the VPS; the image is pulled from ghcr.
  web:
    image: ghcr.io/daviddokrao/lila-docker:lila-master
    container_name: 9kings-web
    restart: unless-stopped
    environment:
      - LILA_SITE_NAME=9Kings
      - LILA_DOMAIN=9kings.vssa.com
      - LILA_URL=https://9kings.vssa.com
      # supervisord re-runs reset-db.sh on every start, so this controls the
      # password of every seeded account. Left unset it falls back to the public
      # default "password" and also mints lip_<username> API tokens.
      - LILA_USER_PASSWORD=${LILA_USER_PASSWORD:?set it in deploy/.env on the VPS}
      - JAVA_OPTS=-Xms2g -Xmx3g
      # Mail thật. Không đặt MAILER_MOCK=false thì lila chỉ ghi log, không gửi.
      # Giá trị nằm ở deploy/.env trên VPS, không commit.
      #
      # Mọi mặc định ở đây phải là giá trị DÙNG ĐƯỢC, không được để rỗng: với
      # HOCON, một biến rỗng vẫn là "đã đặt" nên nó sẽ ghi đè giá trị của
      # base.conf thành chuỗi rỗng thay vì giữ mặc định.
      - MAILER_MOCK=${MAILER_MOCK:-true}
      - MAILER_HOST=${MAILER_HOST:-localhost}
      - MAILER_PORT=${MAILER_PORT:-587}
      - MAILER_TLS=${MAILER_TLS:-true}
      - MAILER_USER=${MAILER_USER:-unused}
      - MAILER_PASSWORD=${MAILER_PASSWORD:-unused}
      - MAILER_SENDER=${MAILER_SENDER:-9Kings <noreply@9kings.vssa.com>}
    expose:
      - 8080
    networks:
      - edge
    volumes:
      # Kho dữ liệu MongoDB. Không có dòng này thì mọi tài khoản người thật
      # đăng ký sẽ biến mất ở lần deploy kế tiếp, vì /seeded nằm trong image.
      - mongodb:/seeded

networks:
  edge:
    external: true

volumes:
  mongodb:
