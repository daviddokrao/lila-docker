services:
  # Single self-contained image built by .github/workflows/publish-image.yml from
  # our lila fork: lila + lila-ws + mongodb + redis + caddy under supervisord.
  # Nothing is built on the VPS; the image is pulled from ghcr.
  web:
    image: ghcr.io/daviddokrao/lila-docker:lila-master
    # Tên container phải là <name>-web với name của deploy.json: Caddy trỏ thẳng vào
    # 9kings-web:8080. Đây là tên hạ tầng, không phải tên thương hiệu — thương hiệu
    # hiển thị là LILA_SITE_NAME ngay dưới.
    container_name: 9kings-web
    restart: unless-stopped
    environment:
      - LILA_SITE_NAME=HungKings
      # Địa chỉ hiện ra sau nút "Bấm để hiện email" ở trang Liên hệ. CHƯA KIỂM
      # hòm thư này có người đọc hay không — đổi ở deploy/.env nếu cần.
      - LILA_CONTACT_EMAIL=${LILA_CONTACT_EMAIL:-contact@hungkings.com}
      # Domain chính thức từ 04/08: hungkings.com (dự án cũ chạy domain này đã huỷ, xem
      # HANDOFF). Hai biến này chi phối MỌI URL tuyệt đối lila phát ra — CSP, wss://,
      # hreflang, og:image, link trong thư — nên đổi ở đây là đủ, KHÔNG cần dựng lại image.
      # Đổi giá trị thì phải deploy lại để compose recreate container (đổi env mà chỉ
      # restart thì tiến trình vẫn giữ env cũ).
      # LƯU Ý: chỉ khai MỘT domain ở đây, đó là domain chuẩn. hungkings-chess.vssa.com vẫn
      # được Caddy nhận (xem deploy.json) nhưng mọi link trên trang sẽ trỏ về hungkings.com.
      - LILA_DOMAIN=hungkings.com
      - LILA_URL=https://hungkings.com
      # supervisord re-runs reset-db.sh on every start, so this controls the
      # password of every seeded account. Left unset it falls back to the public
      # default "password" and also mints lip_<username> API tokens.
      - LILA_USER_PASSWORD=${LILA_USER_PASSWORD:?set it in deploy/.env on the VPS}
      # Khoá AES bọc hash mật khẩu. `:?` để deploy CHẾT ngay nếu thiếu — mono.conf cũng
      # không có fallback, nên không có đường nào chạy bằng khoá mặc định công khai của
      # upstream nữa. Đổi khoá thì phải mã hoá lại cột bpass trong MongoDB cùng lượt
      # (xem HANDOFF mục "Xoay bpass.secret"), nếu không mọi người mất mật khẩu.
      - LILA_BPASS_SECRET=${LILA_BPASS_SECRET:?set it in deploy/.env on the VPS}
      # scripts/seed-once.sh đọc biến này BÊN TRONG container. Không khai ở đây thì
      # đặt SEED_DB=force trong deploy/.env chẳng có tác dụng gì — compose giữ nó ở
      # phía ngoài, tiến trình không bao giờ thấy. Rỗng = giữ nguyên dữ liệu.
      - SEED_DB=${SEED_DB:-}
      # Trang chủ v2 — mặc định DÙNG ĐƯỢC (không để rỗng: HOCON coi biến rỗng là "đã đặt")
      - LILA_HOME_V2=${LILA_HOME_V2:-false}
      - LILA_HOME_SIDEBAR=${LILA_HOME_SIDEBAR:-false}
      # Diễn đàn tạm tắt. Mặc định `true` = giữ hành vi upstream nếu .env không khai.
      - LILA_FORUM=${LILA_FORUM:-true}
      # Khám phá khai cuộc + tablebase: image gộp KHÔNG có service ở 9002/9000, nên mặc
      # định của bản demo là TẮT (ngược với base.conf, vốn mặc định bật cho máy dev).
      # Có service thật rồi thì đặt LILA_EXPLORER=true + 2 endpoint trong deploy/.env.
      - LILA_EXPLORER=${LILA_EXPLORER:-false}
      - LILA_LOCAL_DEV=${LILA_LOCAL_DEV:-false}
      # Giải swiss chính thức: mặc định `true` = upstream nếu .env không khai. Demo đặt
      # false trong deploy/.env vì đội "lichess-swiss" không tồn tại (giải 404 + lộ brand).
      - LILA_SWISS_OFFICIAL=${LILA_SWISS_OFFICIAL:-true}
      - JAVA_OPTS=-Xms2g -Xmx3g
      # Mail thật. Không đặt MAILER_MOCK=false thì lila chỉ ghi log, không gửi.
      # Giá trị nằm ở deploy/.env trên VPS, không commit.
      #
      # Mọi mặc định ở đây phải là giá trị DÙNG ĐƯỢC, không được để rỗng: với
      # HOCON, một biến rỗng vẫn là "đã đặt" nên nó sẽ ghi đè giá trị của
      # base.conf thành chuỗi rỗng thay vì giữ mặc định.
      - MAILER_MOCK=${MAILER_MOCK:-true}
      - MAILER_HOST=${MAILER_HOST:-localhost}
      - MAILER_PORT=${MAILER_PORT:-587}
      - MAILER_TLS=${MAILER_TLS:-true}
      - MAILER_USER=${MAILER_USER:-unused}
      - MAILER_PASSWORD=${MAILER_PASSWORD:-unused}
      - MAILER_SENDER=${MAILER_SENDER:-HungKings <noreply@hungkings-chess.vssa.com>}
    expose:
      - 8080
    networks:
      - edge
    volumes:
      # Kho dữ liệu MongoDB. Không có dòng này thì mọi tài khoản người thật
      # đăng ký sẽ biến mất ở lần deploy kế tiếp, vì /seeded nằm trong image.
      - mongodb:/seeded

networks:
  edge:
    external: true

volumes:
  mongodb:
